version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: stockmarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/stockmarket
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
    ports:
      - "8180:8080"
    depends_on:
      - postgres

  acciones:
    build: ./Acciones
    container_name: acciones
    ports:
      - "8081:8081"

  usuarios:
    build: ./Usuarios
    container_name: usuarios
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stockmarket
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - postgres
      - keycloak

  portafolio:
    build: ./Portafolio
    container_name: portafolio
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stockmarket
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - postgres
      - keycloak

  orden:
    build: ./Orden
    container_name: orden
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stockmarket
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - postgres
      - keycloak

  api-gateway:
    build: ./ApiGateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - keycloak
      - acciones
      - usuarios
      - portafolio
      - orden

volumes:
  postgres_data: